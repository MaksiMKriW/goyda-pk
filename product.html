  <style>
    .product-gallery {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .main-image {
      position: relative;
      background: linear-gradient(135deg, #0a121c, #051018);
      border-radius: 28px;
      overflow: hidden;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 255, 255, 0.2);
    }
    .main-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.2s ease;
    }
    .main-image:hover img {
      transform: scale(1.05);
    }
    .nav-arrows {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 1rem;
      pointer-events: none;
    }
    .nav-arrows button {
      pointer-events: auto;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--neon-cyan);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.2s ease;
      font-size: 1.2rem;
    }
    .nav-arrows button:hover {
      background: var(--neon-cyan);
      color: #000;
      transform: scale(1.1);
    }
    .thumbnail-list {
      display: flex;
      gap: 0.8rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }
    .thumbnail {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: 0.2s ease;
      flex-shrink: 0;
    }
    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumbnail.active {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px var(--neon-cyan);
    }
    .thumbnail:hover {
      transform: translateY(-3px);
      border-color: var(--neon-pink);
    }
    .image-counter {
      position: absolute;
      bottom: 10px;
      right: 15px;
      background: rgba(0,0,0,0.7);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--neon-cyan);
    }
    .product-not-found {
      text-align: center;
      padding: 4rem 2rem;
    }
    .product-not-found i {
      font-size: 4rem;
      color: var(--text-gray);
      margin-bottom: 1rem;
    }
    .loading-spinner {
      text-align: center;
      padding: 4rem;
    }
    .loading-spinner i {
      font-size: 3rem;
      color: var(--neon-cyan);
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (max-width: 768px) {
      .thumbnail { width: 60px; height: 60px; }
      .nav-arrows button { width: 30px; height: 30px; font-size: 0.9rem; }
    }
  </style>

    function getProductImages(productName) {
      const images = [];
      const imageCounts = {
        'Intel Core i5-13400': 6,
        'AMD Ryzen 5 5600X': 7,
        'Kingston Fury 16GB': 5,
        'Corsair Vengeance 32GB': 4,
        'Samsung 980 1TB': 5,
        'WD Blue 2TB HDD': 5,
        'RTX 3060 12GB': 4,
        'RTX 4070 12GB': 4,
        'Corsair 650W': 7,
        'be quiet! 850W': 7,
        'Deepcool AK620': 7,
        'NZXT Kraken 240': 3
      };
      
      const count = imageCounts[productName] || 1;
      for (let i = 1; i <= count; i++) {
        images.push(`images/${productName} (${i}).png`);
      }
      return images;
    }

        </div>
      `;
    }

    function loadProduct() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'));
      
      
      if (!id || !products[id]) {
        showNotFound();
        return;
      }
      
      currentProduct = products[id];
      currentImages = getProductImages(currentProduct.name);
      currentImageIndex = 0;
      
      renderProductPage();
    }

        const label = parts[0];

        badge.textContent = 'Акция';
        document.querySelector('.main-image').appendChild(badge);

    function attachEventHandlers() {
      // Навигация по изображениям
      const prevBtn = document.getElementById('prevImageBtn');
      const nextBtn = document.getElementById('nextImageBtn');
      if (prevBtn) prevBtn.onclick = () => changeImage(-1);
      if (nextBtn) nextBtn.onclick = () => changeImage(1);
      
      
      document.querySelectorAll('.thumbnail').forEach(thumb => {
        thumb.onclick = () => {
          const index = parseInt(thumb.dataset.index);
          setImage(index);
        };
      });
      
      
      const quantityInput = document.getElementById('quantityInput');
      const minusBtn = document.getElementById('quantityMinus');
      const plusBtn = document.getElementById('quantityPlus');
      
      if (minusBtn) minusBtn.onclick = () => {
        let val = parseInt(quantityInput.value);
        if (val > 1) quantityInput.value = val - 1;
      };
      if (plusBtn) plusBtn.onclick = () => {
        let val = parseInt(quantityInput.value);
        if (val < 99) quantityInput.value = val + 1;
      };
      if (quantityInput) quantityInput.onchange = () => {
        let val = parseInt(quantityInput.value);
        if (isNaN(val) || val < 1) val = 1;
        if (val > 99) val = 99;
        quantityInput.value = val;
      };
      
      
      const addToCartBtn = document.getElementById('addToCartBtn');
      if (addToCartBtn) {
        addToCartBtn.onclick = () => {
          const qty = parseInt(document.getElementById('quantityInput').value) || 1;
          addToCart(currentProduct.id, currentProduct.name, currentProduct.price, currentProduct.icon, qty);
          
          addToCartBtn.innerHTML = '<i class="fas fa-check"></i> Добавлено!';
          addToCartBtn.style.background = '#00ff66';
          addToCartBtn.style.color = '#000';
          setTimeout(() => {
            addToCartBtn.innerHTML = '<i class="fas fa-shopping-cart"></i> В корзину';
            addToCartBtn.style.background = '';
            addToCartBtn.style.color = '';
          }, 800);
        };
      }
      
      const wishlistBtn = document.getElementById('wishlistBtn');
      if (wishlistBtn) wishlistBtn.onclick = () => toggleWishlistProduct();
      
      
      const tabBtns = document.querySelectorAll('.tab-btn');
      tabBtns.forEach(btn => {
        btn.onclick = () => {
          const tabId = btn.dataset.tab;
          tabBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
          document.getElementById(`tab-${tabId}`).classList.add('active');
        };
      });
      
      
      const writeReviewBtn = document.getElementById('writeReviewBtn');
      if (writeReviewBtn) writeReviewBtn.onclick = () => showReviewModal(currentProduct.id, currentProduct.name);
    }

    function changeImage(direction) {
      if (!currentImages.length) return;
      currentImageIndex += direction;
      if (currentImageIndex < 0) currentImageIndex = currentImages.length - 1;
      if (currentImageIndex >= currentImages.length) currentImageIndex = 0;
      setImage(currentImageIndex);
    }

    function setImage(index) {
      currentImageIndex = index;
      const mainImage = document.getElementById('mainImage');
      if (mainImage) mainImage.src = currentImages[currentImageIndex];
      
      const counter = document.getElementById('imageCounter');
      if (counter) counter.textContent = `${currentImageIndex + 1} / ${currentImages.length}`;
      
      document.querySelectorAll('.thumbnail').forEach((thumb, idx) => {
        if (idx === currentImageIndex) thumb.classList.add('active');
        else thumb.classList.remove('active');
      });
    }

    function toggleWishlistProduct() {
      toggleWishlist(currentProduct.id, currentProduct.name, currentProduct.price, currentProduct.icon);
      updateWishlistButton();
    }

    function updateWishlistButton() {
      const btn = document.getElementById('wishlistBtn');
      if (!btn) return;
      if (isInWishlist(currentProduct.id)) {
        btn.innerHTML = '<i class="fas fa-heart"></i> В избранном';
        btn.classList.add('active');
      } else {
        btn.innerHTML = '<i class="far fa-heart"></i> В избранное';
        btn.classList.remove('active');
      }
    }

    function loadReviews() {
      const reviews = JSON.parse(localStorage.getItem('reviews')) || {};
      const productReviews = reviews[currentProduct?.id] || [];
      const reviewsCount = document.getElementById('reviewsCount');
      if (reviewsCount) reviewsCount.textContent = productReviews.length;
      
      const reviewsList = document.getElementById('reviewsList');
      if (!reviewsList) return;
      
      if (productReviews.length === 0) {
        reviewsList.innerHTML = '<p style="text-align: center; color: var(--text-gray); padding: 2rem;">✨ Пока нет отзывов. Будьте первым!</p>';
        return;
      }
      
      reviewsList.innerHTML = productReviews.map(review => `
        <div class="review-item">
          <div class="review-header">
            <i class="fas fa-user-circle"></i>
            <strong>${escapeHtml(review.userName)}</strong>
            <div class="review-rating">
              ${Array(review.rating).fill('<i class="fas fa-star"></i>').join('')}
              ${Array(5 - review.rating).fill('<i class="far fa-star"></i>').join('')}
            </div>
          </div>
          <p>${escapeHtml(review.text)}</p>
          <span class="review-date">📅 ${review.date}</span>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    function loadRelatedProducts() {
      const related = Object.values(products).filter(p => 
        p.category === currentProduct.category && p.id !== currentProduct.id
      ).slice(0, 4);
      
      const container = document.getElementById('relatedProducts');
      if (!container) return;
      
      if (related.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-gray); padding: 2rem;">Нет похожих товаров</p>';
        return;
      }
      
      container.innerHTML = related.map(product => `
        <div class="product-card glass" data-id="${product.id}" onclick="window.location.href='product.html?id=${product.id}'">
          <div class="product-image">
            <img src="images/${product.name} (1).png" alt="${product.name}" onerror="this.src='images/placeholder.png'">
            <div class="product-actions-buttons">
              <button class="btn-icon wishlist-btn-related" data-id="${product.id}" data-name="${product.name}" data-price="${product.price}" data-icon="${product.icon}"><i class="far fa-heart"></i></button>
            </div>
          </div>
          <div class="product-info">
            <h3 class="product-title">${product.name}</h3>
            <div class="product-price">${product.price.toLocaleString()} ₽</div>
            <div class="product-specs">${product.specs.slice(0, 3).map(s => `<span>${s.split(' ')[0]}</span>`).join('')}</div>
            <button class="btn-small add-to-cart-related" data-id="${product.id}" data-name="${product.name}" data-price="${product.price}" data-icon="${product.icon}"><i class="fas fa-shopping-cart"></i> В корзину</button>
          </div>
        </div>
      `).join('');
      
      document.querySelectorAll('.add-to-cart-related').forEach(btn => {
        btn.onclick = (e) => { 
          e.stopPropagation(); 
          const id = parseInt(btn.dataset.id); 
          const name = btn.dataset.name; 
          const price = parseInt(btn.dataset.price); 
          const icon = btn.dataset.icon; 
          addToCart(id, name, price, icon);
        };
      });
      
      document.querySelectorAll('.wishlist-btn-related').forEach(btn => {
        btn.onclick = (e) => { 
          e.stopPropagation(); 
          const id = parseInt(btn.dataset.id); 
          const name = btn.dataset.name; 
          const price = parseInt(btn.dataset.price); 
          const icon = btn.dataset.icon; 
          toggleWishlist(id, name, price, icon);
          updateWishlistButtons();
        };
      });
    }

    
    function checkAuthForActions() {
      const isLogged = localStorage.getItem('isLoggedIn') === 'true';
      if (!isLogged) {
        const addToCartBtn = document.getElementById('addToCartBtn');
        const wishlistBtn = document.getElementById('wishlistBtn');
        const writeReviewBtn = document.getElementById('writeReviewBtn');
        
        if (addToCartBtn) {
          addToCartBtn.onclick = (e) => {
            e.preventDefault();
            showToast('Пожалуйста, войдите в аккаунт', true);
            window.location.href = `login.html?redirect=product.html?id=${currentProduct?.id}`;
          };
        }
        if (wishlistBtn) {
          wishlistBtn.onclick = (e) => {
            e.preventDefault();
            showToast('Пожалуйста, войдите в аккаунт', true);
            window.location.href = `login.html?redirect=product.html?id=${currentProduct?.id}`;
          };
        }
        if (writeReviewBtn) {
          writeReviewBtn.onclick = (e) => {
            e.preventDefault();
            showToast('Пожалуйста, войдите в аккаунт', true);
            window.location.href = `login.html?redirect=product.html?id=${currentProduct?.id}`;
          };
        }
      }
    }

    
    const modal = document.getElementById('reviewModal');
    if (modal) {
      const closeBtn = modal.querySelector('.close-modal');
      if (closeBtn) closeBtn.onclick = () => modal.classList.remove('active');
      
      modal.querySelectorAll('.star-rating i').forEach((star, index) => {
        star.onclick = () => {
          modal.querySelectorAll('.star-rating i').forEach((s, i) => {
            if (i <= index) s.classList.add('active');
            else s.classList.remove('active');
          });
        };
      });
      
      const submitReview = document.getElementById('submitReview');
      if (submitReview) {
        submitReview.onclick = () => {
          const rating = modal.querySelectorAll('.star-rating i.active').length;
          const text = document.getElementById('reviewText').value;
          
          if (rating === 0) {
            showToast('⭐ Поставьте оценку', true);
            return;
          }
          if (!text.trim()) {
            showToast('✏️ Напишите отзыв', true);
            return;
          }
          
          addReview(currentProduct.id, currentProduct.name, rating, text);
          modal.classList.remove('active');
          loadReviews();
        };
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProduct();
      setTimeout(checkAuthForActions, 500);
    });
  </script>
</body>
</html>
